<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIH 2026 - Prototype Access</title>
    <style>
        /* CSS Variables */
        :root {
            --bg-base: #07090C;
            --text-main: #F4F6F8;
            --text-sub: #8B949E;
            --border-subtle: rgba(255, 255, 255, 0.10);
            --border-faint: rgba(255, 255, 255, 0.04);
            --accent: #3B82F6;
            --accent-glow: #60A5FA;
            --alert: #fca5a5;
        }

        /* Reset & Base */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ---------------------------------
           BACKGROUND ATMOSPHERE
        --------------------------------- */
        .bg-gradient {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 75% 50%, rgba(59, 130, 246, 0.025) 0%, rgba(0,0,0,0) 65%);
            z-index: 0;
            pointer-events: none;
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.006) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.006) 1px, transparent 1px);
            background-size: 64px 64px;
            z-index: 1;
            pointer-events: none;
        }

        .bg-noise {
            position: fixed;
            inset: 0;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.025"/></svg>');
            z-index: 2;
            pointer-events: none;
        }

        /* ---------------------------------
           LAYOUT COMPOSITION
        --------------------------------- */
        .page-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 2.5rem 4rem;
            box-sizing: border-box;
            max-width: 1700px;
            margin: 0 auto;
            animation: fadeIn 1s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ---------------------------------
           HEADER NAVIGATION
        --------------------------------- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 2rem;
            margin-bottom: 4rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
        }

        .logo .square {
            width: 6px;
            height: 6px;
            background-color: var(--accent);
        }

        .meta-right {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            color: var(--text-sub);
        }

        /* ---------------------------------
           MAIN CONTENT
        --------------------------------- */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4rem;
        }

        .left-col {
            flex: 0 0 55%;
            max-width: 640px;
        }

        .right-col {
            flex: 0 0 45%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ---------------------------------
           LEFT SIDE TYPOGRAPHY
        --------------------------------- */
        .eyebrow {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            color: var(--text-sub);
            margin-bottom: 2rem;
        }

        h1 {
            font-size: clamp(48px, 5.5vw, 84px);
            line-height: 1.05;
            letter-spacing: -0.03em;
            margin: 0 0 2rem 0;
            font-weight: 600;
        }

        .h1-light {
            font-weight: 400;
            color: var(--text-sub);
        }

        p.desc {
            font-size: clamp(16px, 1.2vw, 19px);
            line-height: 1.6;
            color: var(--text-sub);
            max-width: 520px;
            margin: 0 0 3rem 0;
        }

        /* ---------------------------------
           CTA BUTTON
        --------------------------------- */
        .cta-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-start;
        }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            width: 230px;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid var(--border-subtle);
            border-radius: 9px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .cta-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(96, 165, 250, 0.35);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.1);
        }

        .arrow {
            transition: transform 0.3s ease;
            font-size: 1.1rem;
            color: var(--text-sub);
        }

        .cta-btn:hover .arrow {
            transform: translateX(5px);
            color: var(--text-main);
        }

        .cta-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .cta-sub {
            font-size: 0.8rem;
            color: var(--text-sub);
            opacity: 0.7;
        }

        /* ---------------------------------
           RIGHT SIDE — CLEAN AV VISUAL
        --------------------------------- */
        .av-container {
            width: 100%;
            max-width: 520px;
            position: relative;
        }

        .av-svg {
            width: 100%;
            height: auto;
            overflow: visible;
        }

        /* Soft spotlight behind the scene */
        .scene-glow {
            fill: none;
        }

        /* Road */
        .road-fill {
            fill: #171C24;
        }
        .road-edge {
            fill: none;
            stroke: #343B46;
            stroke-width: 2px;
        }
        .road-marking {
            fill: none;
            stroke: rgba(220, 230, 242, 0.08);
            stroke-width: 1.5px;
            stroke-dasharray: 14 18;
        }

        /* Original path */
        .orig-path {
            fill: none;
            stroke: rgba(220, 230, 242, 0.35);
            stroke-width: 2px;
            stroke-dasharray: 8 10;
            stroke-linecap: round;
        }

        /* Safe adaptive path */
        .safe-path-glow {
            fill: none;
            stroke: #3B82F6;
            stroke-width: 14px;
            stroke-linecap: round;
            opacity: 0.12;
            filter: blur(6px);
        }
        .safe-path {
            fill: none;
            stroke: #3B82F6;
            stroke-width: 3.5px;
            stroke-linecap: round;
        }
        .safe-path-core {
            fill: none;
            stroke: #93c5fd;
            stroke-width: 1.5px;
            stroke-linecap: round;
            opacity: 0.5;
        }

        /* Energy dot traveling along path */
        .energy-dot {
            offset-rotate: 0deg;
            animation: travelPath 7s ease-in-out infinite;
        }

        @keyframes travelPath {
            0%   { offset-distance: 0%;   opacity: 0; }
            8%   { opacity: 1; }
            88%  { opacity: 1; }
            100% { offset-distance: 100%; opacity: 0; }
        }

        /* Vehicle */
        .vehicle-body {
            fill: #1a2030;
            stroke: #DCE6F2;
            stroke-width: 1.5px;
        }
        .vehicle-roof {
            fill: #0f1520;
            stroke: rgba(220, 230, 242, 0.3);
            stroke-width: 1px;
        }
        .vehicle-light-front {
            fill: #60A5FA;
        }
        .vehicle-light-rear {
            fill: #f87171;
            opacity: 0.6;
        }

        /* Obstacle (pedestrian) */
        .obstacle-glow {
            animation: obstaclePulse 2.5s ease-in-out infinite alternate;
        }
        .obstacle-body {
            fill: none;
            stroke: #F59E0B;
            stroke-width: 1.5px;
        }
        .obstacle-head {
            fill: #F59E0B;
            opacity: 0.9;
        }

        @keyframes obstaclePulse {
            0%   { opacity: 0.15; }
            100% { opacity: 0.35; }
        }

        /* Labels */
        .vis-label {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 10px;
            letter-spacing: 0.14em;
            fill: #8B949E;
            opacity: 0.7;
        }
        .vis-label-sig {
            font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.2em;
            fill: #8B949E;
            opacity: 0.3;
        }

        @media (prefers-reduced-motion: reduce) {
            .energy-dot   { animation: none !important; opacity: 0.6; offset-distance: 45%; }
            .obstacle-glow { animation: none !important; opacity: 0.25; }
        }

        /* ---------------------------------
           FOOTER
        --------------------------------- */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-subtle);
            padding-top: 1.5rem;
            margin-top: 5rem;
            font-size: 0.7rem;
            color: var(--text-sub);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* ---------------------------------
           RESPONSIVE RECOMPOSITION
        --------------------------------- */
        @media (max-width: 1024px) {
            .page-wrapper {
                padding: 2.5rem 3rem;
            }
            .main-content {
                flex-direction: column;
                align-items: flex-start;
                gap: 5rem;
            }
            .left-col {
                flex: none;
                width: 100%;
                max-width: none;
            }
            .right-col {
                flex: none;
                width: 100%;
                justify-content: flex-start;
            }
            .av-container {
                max-width: 400px;
            }
        }

        @media (max-width: 640px) {
            .page-wrapper {
                padding: 1.5rem;
            }
            header {
                padding-bottom: 1.5rem;
                margin-bottom: 3rem;
            }
            .meta-right {
                display: none;
            }
            h1 {
                font-size: clamp(40px, 10vw, 56px);
                margin-bottom: 1.5rem;
            }
            p.desc {
                margin-bottom: 2.5rem;
            }
            .av-container {
                max-width: 320px;
                margin-top: 1rem;
            }
            footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
                padding-top: 1.5rem;
                margin-top: 4rem;
            }
            .cta-btn {
                width: 100%;
                max-width: 280px;
            }
        }
    </style>
</head>
<body>

    <!-- Environment Layers -->
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>
    <div class="bg-noise"></div>

    <div class="page-wrapper">
        
        <!-- Top Navigation -->
        <header>
            <div class="logo">
                <span class="square"></span>
                SIH 2026
            </div>
            <div class="meta-right">PROTOTYPE / ACCESS</div>
        </header>

        <!-- Main Composition -->
        <div class="main-content">
            
            <!-- Left: Editorial Content -->
            <div class="left-col">
                <span class="eyebrow">TEMPORARY ACCESS</span>
                
                <h1>
                    <span class="h1-light">Oops.</span><br>
                    Something went wrong.
                </h1>
                
                <p class="desc">The prototype is currently being updated. Access the latest available version below.</p>
                
                <div class="cta-wrapper">
                    <a href="#" id="continue-link" class="cta-btn">
                        <span>Continue to Prototype</span>
                        <span class="arrow">&rarr;</span>
                    </a>
                    <span class="cta-sub">Redirects to the latest prototype</span>
                </div>
            </div>

            <!-- Right: Clean AV Path Planning Visual -->
            <div class="right-col">
                <div class="av-container">
                    <svg class="av-svg" viewBox="0 0 480 600" preserveAspectRatio="xMidYMid meet">
                        <defs>
                            <!-- Soft spotlight behind the road -->
                            <radialGradient id="spotGlow" cx="50%" cy="45%" r="50%">
                                <stop offset="0%"  stop-color="#3B82F6" stop-opacity="0.06" />
                                <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
                            </radialGradient>

                            <!-- Obstacle amber radial -->
                            <radialGradient id="obstacleGlow" cx="50%" cy="50%" r="50%">
                                <stop offset="0%"  stop-color="#F59E0B" stop-opacity="0.20" />
                                <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
                            </radialGradient>

                            <!-- Path definitions -->
                            <path id="adaptivePath" d="M 240 530 C 240 480, 240 440, 240 400 C 240 360, 220 330, 190 290 C 160 250, 160 210, 185 180 C 210 150, 240 130, 245 80" />
                        </defs>

                        <!-- Scene glow -->
                        <ellipse cx="240" cy="300" rx="220" ry="260" fill="url(#spotGlow)" />


                        <!-- ====== ROAD ====== -->

                        <!-- Road surface -->
                        <path class="road-fill" d="
                            M 100 600
                            C 95 520, 85 440, 100 360
                            C 115 280, 135 220, 150 140
                            C 160 90, 165 40, 170 -10
                            L 330 -10
                            C 335 40, 340 90, 345 140
                            C 355 220, 365 280, 370 360
                            C 380 440, 375 520, 370 600
                            Z
                        " />

                        <!-- Left road edge -->
                        <path class="road-edge" d="
                            M 100 600
                            C 95 520, 85 440, 100 360
                            C 115 280, 135 220, 150 140
                            C 160 90, 165 40, 170 -10
                        " />
                        <!-- Right road edge -->
                        <path class="road-edge" d="
                            M 370 600
                            C 375 520, 380 440, 370 360
                            C 365 280, 355 220, 345 140
                            C 340 90, 335 40, 330 -10
                        " />

                        <!-- Faint broken center marking -->
                        <path class="road-marking" d="
                            M 240 600
                            C 238 520, 235 440, 238 360
                            C 241 280, 246 220, 248 140
                            C 249 90, 250 40, 250 -10
                        " />


                        <!-- ====== ORIGINAL PATH (gray dashed) ====== -->

                        <path class="orig-path" d="
                            M 240 530
                            C 240 480, 240 440, 240 400
                            C 240 360, 242 320, 245 280
                            C 248 240, 250 200, 250 160
                            C 250 120, 250 90, 248 60
                        " />


                        <!-- ====== OBSTACLE (pedestrian) ====== -->

                        <g transform="translate(248, 240)">
                            <!-- Amber glow behind obstacle -->
                            <circle cx="0" cy="0" r="40" fill="url(#obstacleGlow)" class="obstacle-glow" />

                            <!-- Pedestrian: head -->
                            <circle cx="0" cy="-16" r="6" class="obstacle-head" />

                            <!-- Pedestrian: body -->
                            <line x1="0" y1="-10" x2="0" y2="8" class="obstacle-body" />

                            <!-- Pedestrian: arms -->
                            <line x1="-8" y1="-3" x2="8" y2="-3" class="obstacle-body" />

                            <!-- Pedestrian: legs -->
                            <line x1="0" y1="8" x2="-7" y2="20" class="obstacle-body" />
                            <line x1="0" y1="8" x2="7" y2="20" class="obstacle-body" />
                        </g>


                        <!-- ====== ADAPTIVE SAFE PATH (blue) ====== -->

                        <!-- Glow layer -->
                        <use href="#adaptivePath" class="safe-path-glow" />
                        <!-- Main path -->
                        <use href="#adaptivePath" class="safe-path" />
                        <!-- Bright core -->
                        <use href="#adaptivePath" class="safe-path-core" />

                        <!-- Energy dot traveling along the path -->
                        <circle r="5" fill="#60A5FA" class="energy-dot" style="offset-path:path('M 240 530 C 240 480, 240 440, 240 400 C 240 360, 220 330, 190 290 C 160 250, 160 210, 185 180 C 210 150, 240 130, 245 80')" />


                        <!-- ====== AUTONOMOUS VEHICLE ====== -->

                        <g transform="translate(240, 500)">
                            <!-- Vehicle body -->
                            <rect x="-16" y="-28" width="32" height="52" rx="8" class="vehicle-body" />

                            <!-- Roof / cabin -->
                            <rect x="-11" y="-20" width="22" height="16" rx="5" class="vehicle-roof" />

                            <!-- Front headlights -->
                            <rect x="-13" y="-28" width="6" height="3" rx="1.5" class="vehicle-light-front" />
                            <rect x="7"   y="-28" width="6" height="3" rx="1.5" class="vehicle-light-front" />

                            <!-- Rear lights -->
                            <rect x="-12" y="20" width="5" height="2.5" rx="1" class="vehicle-light-rear" />
                            <rect x="7"   y="20" width="5" height="2.5" rx="1" class="vehicle-light-rear" />

                            <!-- Blue accent stripe -->
                            <line x1="-16" y1="0" x2="-16" y2="-15" stroke="#3B82F6" stroke-width="1.5" opacity="0.6" />
                            <line x1="16"  y1="0" x2="16"  y2="-15" stroke="#3B82F6" stroke-width="1.5" opacity="0.6" />
                        </g>


                        <!-- ====== LABELS ====== -->

                        <text x="240" y="38" text-anchor="middle" class="vis-label">ADAPTIVE PATH PLANNING</text>

                        <text x="400" y="588" text-anchor="end" class="vis-label-sig">ROADMITRA</text>

                    </svg>
                </div>
            </div>

        </div>

        <!-- Footer -->
        <footer>
            <div class="footer-left">SIH 2026 &nbsp;&bull;&nbsp; Prototype Access</div>
            <div class="footer-right">01 / 01</div>
        </footer>

    </div>

    <!-- Configuration Script -->
    <script>
        // ========================================================
        // CONFIGURATION
        // ========================================================
        const PROTOTYPE_URL = "https://example.com";
        // ========================================================

        document.getElementById("continue-link").href = PROTOTYPE_URL;
    </script>
</body>
</html>
